<div style="font-family: system-ui, sans-serif, Arial; font-size: 12px">
  <div>A new booking has been received. Please review the details below and respond promptly.</div>
  <div
    style="
      margin-top: 20px;
      padding: 15px 0;
      border-width: 1px 0;
      border-style: dashed;
      border-color: lightgrey;
    "
  >
    <table role="presentation">
      <tr>
        <td style="vertical-align: top">
          <div
            style="
              padding: 6px 10px;
              margin: 0 10px;
              background-color: aliceblue;
              border-radius: 5px;
              font-size: 26px;
            "
            role="img"
          >
            📅
          </div>
        </td>
        <td style="vertical-align: top">
          <div style="color: #2c3e50; font-size: 16px">
            <strong>{{name}}</strong>
          </div>
          <div style="color: #cccccc; font-size: 13px">{{email}}</div>
          <div style="margin-top: 8px; font-size: 14px; color: #333;">
            <strong>Phone:</strong> {{phone}}<br/>
            <strong>Program:</strong> {{program}}<br/>
            <strong>Date:</strong> {{date}}<br/>
            <strong>Notes:</strong> {{notes}}
          </div>
        </td>
      </tr>
    </table>
  </div>
</div>
